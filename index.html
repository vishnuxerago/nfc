<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Registration</title>
  <style>
    :root {
      --bg: #f0fdfa;
      --ink: #134e4a;
      --muted: #5b7c78;
      --brand: #0f766e;
      --brand-dark: #115e59;
      --danger: #b91c1c;
      --surface: #ffffff;
      --border: #99f6e4;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #5eead4 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #99f6e4 0%, transparent 50%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 40px;
    }
    .sheet {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(15, 118, 110, 0.12);
      border: 1px solid var(--border);
      padding: 28px 22px 24px;
    }
    .brand {
      margin: 0 0 22px;
      text-align: center;
      font-size: 2rem;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--brand);
      font-weight: 800;
    }
    h1 { margin: 0 0 8px; font-size: 1.35rem; line-height: 1.25; text-align: center; }
    .lede { margin: 0 0 22px; color: var(--muted); font-size: 0.95rem; line-height: 1.45; text-align: center; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .field { margin-bottom: 16px; }
    .phone-row { display: grid; grid-template-columns: 72px 1fr; gap: 8px; }
    input, button { font: inherit; width: 100%; }
    input {
      border: 1.5px solid #a7f3d0;
      border-radius: 10px;
      padding: 12px 14px;
      background: #f8fffe;
      color: var(--ink);
    }
    input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.18);
    }
    input.invalid { border-color: #f87171; background: #fef2f2; }
    .prefix {
      display: grid;
      place-items: center;
      border: 1.5px solid #a7f3d0;
      border-radius: 10px;
      background: #ecfdf5;
      font-weight: 700;
      color: var(--brand-dark);
    }
    .error { font-size: 0.8rem; margin: 6px 0 0; line-height: 1.35; color: var(--danger); display: none; }
    .error.show { display: block; }
    button {
      border: none;
      border-radius: 10px;
      padding: 14px 16px;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.65; cursor: wait; }
    button.secondary {
      background: #fff;
      color: var(--brand-dark);
      border: 1.5px solid var(--border);
      margin-top: 10px;
    }
    .status { margin-top: 14px; font-size: 0.88rem; text-align: center; color: var(--muted); min-height: 1.2em; }
    .status.err { color: var(--danger); }
    .status.ok { color: var(--brand-dark); }
    .panel { display: none; }
    .panel.active { display: block; }
    #otp { letter-spacing: 0.35em; font-size: 1.25rem; text-align: center; font-weight: 700; }
  </style>
</head>
<body>
  <main class="sheet">
    <div id="step-form" class="panel active">
      <p class="brand">Registration</p>

      <form id="reg-form" novalidate>
        <div class="field">
          <label for="fullName">Full name</label>
          <input id="fullName" type="text" maxlength="120" placeholder="Jane Doe" autocomplete="name" required />
          <p class="error" id="nameError">Please enter your full name.</p>
        </div>
        <div class="field">
          <label for="mobile">Mobile number</label>
          <div class="phone-row">
            <div class="prefix">+91</div>
            <input id="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="9876543210" autocomplete="tel-national" required />
          </div>
          <p class="error" id="mobileError">This number was not correct</p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@gmail.com" autocomplete="email" required />
          <p class="error" id="emailError">Use a valid @gmail.com address</p>
        </div>
        <button type="submit" id="submitBtn">Verify</button>
        <p class="status" id="formStatus" role="status"></p>
      </form>
    </div>

    <div id="step-otp" class="panel">
      <p class="brand">Registration</p>
      <h1>Enter code</h1>
      <p class="lede" id="otpLede">We sent a 6-digit code. It expires in 5 minutes.</p>
      <form id="otp-form" novalidate>
        <div class="field">
          <label for="otp">Verification code</label>
          <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code" required />
          <p class="error" id="otpError">Enter the 6-digit code.</p>
        </div>
        <button type="submit" id="verifyBtn">Verify</button>
        <button type="button" class="secondary" id="resendBtn">Resend code</button>
        <button type="button" class="secondary" id="retryBtn">Start over</button>
        <p class="status" id="otpStatus" role="status"></p>
      </form>
    </div>
  </main>

  <script>
    var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhQGf0CVmKO46t-LMClOXAcBy1ZOcJEfJSJz9SgaIQ-RNUIEPw4-L_xB3KJNW88s7oog/exec";
  </script>
  <script>
    (function () {
      var formPanel = document.getElementById("step-form");
      var otpPanel = document.getElementById("step-otp");
      var form = document.getElementById("reg-form");
      var otpForm = document.getElementById("otp-form");
      var nameInput = document.getElementById("fullName");
      var mobileInput = document.getElementById("mobile");
      var emailInput = document.getElementById("email");
      var otpInput = document.getElementById("otp");
      var nameError = document.getElementById("nameError");
      var mobileError = document.getElementById("mobileError");
      var emailError = document.getElementById("emailError");
      var otpError = document.getElementById("otpError");
      var formStatus = document.getElementById("formStatus");
      var otpStatus = document.getElementById("otpStatus");
      var otpLede = document.getElementById("otpLede");
      var submitBtn = document.getElementById("submitBtn");
      var verifyBtn = document.getElementById("verifyBtn");

      var state = { registrationId: null, email: "", mobile: "", name: "" };

      function api(payload) {
        return fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "cors",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        }).then(function (r) { return r.json(); });
      }

      function show(panel) {
        formPanel.classList.toggle("active", panel === "form");
        otpPanel.classList.toggle("active", panel === "otp");
      }

      function validMobile(v) {
        return /^[6-9]\d{9}$/.test(String(v || "").replace(/\D/g, ""));
      }

      function validEmail(v) {
        return /^[a-z0-9._%+-]+@gmail\.com$/i.test(String(v || "").trim());
      }

      function validName(v) {
        var n = String(v || "").replace(/\s+/g, " ").trim();
        return n.length >= 2 && n.length <= 120;
      }

      function sendOtp() {
        var name = nameInput.value.replace(/\s+/g, " ").trim();
        var mobile = mobileInput.value.replace(/\D/g, "");
        var email = emailInput.value.trim().toLowerCase();
        nameError.classList.remove("show");
        mobileError.classList.remove("show");
        emailError.classList.remove("show");
        nameInput.classList.remove("invalid");
        mobileInput.classList.remove("invalid");
        emailInput.classList.remove("invalid");
        formStatus.textContent = "";
        formStatus.className = "status";

        var ok = true;
        if (!validName(name)) {
          nameInput.classList.add("invalid");
          nameError.classList.add("show");
          ok = false;
        }
        if (!validMobile(mobile)) {
          mobileInput.classList.add("invalid");
          mobileError.classList.add("show");
          ok = false;
        }
        if (!validEmail(email)) {
          emailInput.classList.add("invalid");
          emailError.classList.add("show");
          ok = false;
        }
        if (!ok) return;

        submitBtn.disabled = true;
        formStatus.textContent = "Sending code…";

        api({ action: "sendOtp", name: name, mobile: mobile, email: email })
          .then(function (body) {
            submitBtn.disabled = false;
            if (!body.ok) {
              if (body.alreadyRegistered) {
                formStatus.textContent = "Already registered";
                formStatus.className = "status err";
                return;
              }
              formStatus.textContent = body.error || "Could not send code";
              formStatus.className = "status err";
              return;
            }
            state.registrationId = body.registrationId;
            state.name = name;
            state.email = email;
            state.mobile = mobile;
            otpLede.textContent = "We sent a 6-digit code to " + email + ". It expires in 5 minutes.";
            otpInput.value = "";
            otpStatus.textContent = "";
            show("otp");
          })
          .catch(function (err) {
            submitBtn.disabled = false;
            formStatus.textContent = err.message || "Could not reach server";
            formStatus.className = "status err";
          });
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        sendOtp();
      });

      document.getElementById("resendBtn").addEventListener("click", function () {
        show("form");
        formStatus.textContent = "";
      });

      document.getElementById("retryBtn").addEventListener("click", function () {
        state = { registrationId: null, email: "", mobile: "", name: "" };
        show("form");
        formStatus.textContent = "";
      });

      otpForm.addEventListener("submit", function (e) {
        e.preventDefault();
        otpError.classList.remove("show");
        otpInput.classList.remove("invalid");
        otpStatus.textContent = "";
        otpStatus.className = "status";

        var otp = otpInput.value.replace(/\D/g, "");
        if (!/^\d{6}$/.test(otp)) {
          otpInput.classList.add("invalid");
          otpError.classList.add("show");
          return;
        }
        if (!state.registrationId) {
          otpStatus.textContent = "Session missing. Start over.";
          otpStatus.className = "status err";
          return;
        }

        verifyBtn.disabled = true;
        otpStatus.textContent = "Verifying…";

        api({ action: "verifyOtp", id: state.registrationId, otp: otp })
          .then(function (body) {
            verifyBtn.disabled = false;
            if (!body.ok) {
              otpStatus.textContent = body.error || "Verification failed";
              otpStatus.className = "status err";
              return;
            }
            otpStatus.textContent = "Verified — redirecting…";
            otpStatus.className = "status ok";
            window.location.href = "thank-you.html";
          })
          .catch(function () {
            verifyBtn.disabled = false;
            otpStatus.textContent = "Network error. Try again.";
            otpStatus.className = "status err";
          });
      });
    })();
  </script>
</body>
</html>

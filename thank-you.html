<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Thank you</title>
  <style>
    :root {
      --bg: #f0fdfa;
      --ink: #134e4a;
      --muted: #5b7c78;
      --green: #10b981;
      --green-dark: #059669;
      --white: #ffffff;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background:
        radial-gradient(ellipse 70% 45% at 50% 0%, #6ee7b7 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 100%, #a7f3d0 0%, transparent 50%),
        var(--bg);
      overflow: hidden;
    }

    .card {
      width: 100%;
      max-width: 380px;
      text-align: center;
      background: var(--white);
      border-radius: 20px;
      padding: 40px 28px 36px;
      box-shadow: 0 16px 48px rgba(16, 185, 129, 0.18);
      border: 1px solid #a7f3d0;
      animation: cardIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .badge {
      width: 112px;
      height: 112px;
      margin: 0 auto 22px;
      position: relative;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 10px 28px rgba(16, 185, 129, 0.45);
      transform: scale(0);
      animation: pop 0.45s 0.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .ring::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 3px solid rgba(16, 185, 129, 0.35);
      animation: pulse 1.6s 0.7s ease-out infinite;
    }

    @keyframes pop {
      0% { transform: scale(0); }
      70% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes pulse {
      0% { transform: scale(0.85); opacity: 0.8; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    .check {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .check svg {
      width: 54px;
      height: 54px;
      overflow: visible;
    }

    .check path {
      fill: none;
      stroke: var(--white);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: draw 0.45s 0.45s ease-out forwards;
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      opacity: 0;
      animation: fadeUp 0.45s 0.7s ease-out forwards;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.45;
      opacity: 0;
      animation: fadeUp 0.45s 0.85s ease-out forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .card { position: relative; z-index: 1; }

    .dot {
      position: absolute;
      top: -12px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      opacity: 0;
      animation: fall 1.4s ease-in forwards;
    }

    @keyframes fall {
      0% {
        opacity: 1;
        transform: translateY(0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(100vh) rotate(520deg);
      }
    }
  </style>
</head>
<body>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <main class="card">
    <div class="badge" aria-hidden="true">
      <div class="ring"></div>
      <div class="check">
        <svg viewBox="0 0 52 52" role="img" aria-label="Success">
          <path d="M14 27 L22 35 L38 17" />
        </svg>
      </div>
    </div>
    <h1>Thank you!</h1>
    <p>Your details were saved successfully.</p>
  </main>

  <script>
    (function () {
      var root = document.getElementById("confetti");
      var colors = ["#10b981", "#34d399", "#a7f3d0", "#ffffff", "#059669", "#6ee7b7"];
      for (var i = 0; i < 28; i++) {
        var d = document.createElement("span");
        d.className = "dot";
        d.style.left = Math.random() * 100 + "%";
        d.style.background = colors[i % colors.length];
        d.style.width = 6 + Math.random() * 8 + "px";
        d.style.height = d.style.width;
        d.style.animationDelay = 0.2 + Math.random() * 0.7 + "s";
        d.style.animationDuration = 1.1 + Math.random() * 0.9 + "s";
        root.appendChild(d);
      }
    })();
  </script>
</body>
</html>

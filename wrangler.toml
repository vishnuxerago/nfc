name = "nfc-whatsapp-verify"
compatibility_date = "2025-11-01"
pages_build_output_dir = "public"

# After: npx wrangler d1 create nfc-verify
# replace database_id with the real UUID from that command
[[d1_databases]]
binding = "DB"
database_name = "nfc-verify"
database_id = "00000000-0000-0000-0000-000000000000"

# Local secrets: copy .dev.vars.example → .dev.vars
# Production: wrangler pages secret put BUSINESS_WA_E164
#             wrangler pages secret put ADMIN_PASSWORD
#             wrangler pages secret put SESSION_SECRET

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Admin · Registration</title>
  <style>
    :root {
      --bg: #f0fdfa;
      --ink: #134e4a;
      --muted: #5b7c78;
      --brand: #0f766e;
      --brand-dark: #115e59;
      --danger: #b91c1c;
      --ok: #047857;
      --surface: #ffffff;
      --border: #99f6e4;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #5eead4 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #99f6e4 0%, transparent 50%),
        var(--bg);
      padding: 24px 16px 40px;
    }
    .sheet {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(15, 118, 110, 0.12);
      border: 1px solid var(--border);
      padding: 28px 22px 24px;
    }
    .brand {
      margin: 0 0 8px;
      text-align: center;
      font-size: 2rem;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--brand);
      font-weight: 800;
    }
    .sub {
      margin: 0 0 6px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .admin-id {
      margin: 0 0 22px;
      text-align: center;
      color: var(--brand-dark);
      font-size: 0.92rem;
      font-weight: 600;
      word-break: break-all;
    }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; text-align: left; }
    .field { margin-bottom: 16px; }
    input, button { font: inherit; }
    input {
      width: 100%;
      border: 1.5px solid #a7f3d0;
      border-radius: 10px;
      padding: 12px 14px;
      background: #f8fffe;
      color: var(--ink);
    }
    input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.18);
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 14px 16px;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }
    .btn.secondary {
      background: #fff;
      color: var(--brand-dark);
      border: 1.5px solid var(--border);
      margin-top: 10px;
    }
    .btn.linkish {
      background: none;
      border: none;
      color: var(--brand);
      padding: 8px 0 0;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
      width: auto;
      display: block;
      margin: 8px auto 0;
      text-align: center;
    }
    .btn:disabled, .icon-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .status { margin-top: 14px; font-size: 0.88rem; text-align: center; color: var(--muted); min-height: 1.2em; }
    .status.err { color: var(--danger); }
    .status.ok { color: var(--brand-dark); }
    .hidden { display: none !important; }
    .login-wrap { max-width: 420px; margin: 0 auto; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .toolbar h2 { margin: 0; font-size: 1.1rem; text-align: left; }
    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .export-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      background: #f8fffe;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--brand-dark);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }
    .export-group .icon-btn {
      border: none;
      background: transparent;
      width: 36px;
      height: 36px;
    }
    .icon-btn:hover { background: #ecfdf5; }
    .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; justify-content: center; }
    .tabs button {
      width: auto;
      background: #fff;
      color: var(--brand-dark);
      border: 1.5px solid var(--border);
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    .tabs button.active {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }
    .count { font-size: 0.85rem; color: var(--muted); margin: 0 0 10px; text-align: center; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 680px; }
    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid #ccfbf1;
      vertical-align: middle;
    }
    th {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      background: #f0fdfa;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 999px;
      background: #ecfdf5;
      color: var(--ok);
      white-space: nowrap;
    }
    .badge.warn { background: #fff7ed; color: #c2410c; }
    .badge.bad { background: #fef2f2; color: var(--danger); }
    .panel { display: none; }
    .panel.active { display: block; }
    .cooldown { font-size: 0.78rem; color: var(--muted); margin-left: 6px; }
  </style>
</head>
<body>
  <main class="sheet">
    <p class="brand">Registration</p>
    <p class="sub" id="pageSub">Admin login</p>
    <p class="admin-id" id="adminIdLabel">Admin: vishnu.xerago@gmail.com</p>

    <section id="loginCard" class="login-wrap">
      <div id="panel-login" class="panel active">
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" />
        </div>
        <button type="button" class="btn" id="loginBtn">Log in</button>
        <button type="button" class="btn linkish" id="showForgotBtn">Forgot password?</button>
        <p class="status" id="loginMsg"></p>
      </div>

      <div id="panel-forgot" class="panel">
        <div class="field">
          <label for="forgotEmail">Admin email</label>
          <input id="forgotEmail" type="email" placeholder="you@gmail.com" value="vishnu.xerago@gmail.com" />
        </div>
        <button type="button" class="btn" id="sendResetBtn">Send reset code</button>
        <button type="button" class="btn secondary" id="backLoginBtn1">Back to login</button>
        <p class="status" id="forgotMsg"></p>
      </div>

      <div id="panel-reset" class="panel">
        <div class="field">
          <label for="resetCode">Reset code (from email)</label>
          <input id="resetCode" type="text" inputmode="numeric" maxlength="6" placeholder="••••••" />
        </div>
        <div class="field">
          <label for="newPassword">New password</label>
          <input id="newPassword" type="password" autocomplete="new-password" />
        </div>
        <button type="button" class="btn" id="resetBtn">Change password</button>
        <button type="button" class="btn secondary" id="backLoginBtn2">Back to login</button>
        <p class="status" id="resetMsg"></p>
      </div>
    </section>

    <section id="dash" class="hidden">
      <div class="toolbar">
        <h2>Registrations</h2>
        <div class="toolbar-actions">
          <div class="export-group" title="Export">
            <button type="button" class="icon-btn" id="exportCsvBtn" aria-label="Export CSV for Sheets" title="CSV (Sheets)">
              <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 19h16"/></svg>
            </button>
            <button type="button" class="icon-btn" id="exportXmlBtn" aria-label="Export XML" title="XML">
              <svg viewBox="0 0 24 24"><path d="M8 8l-4 4 4 4"/><path d="M16 8l4 4-4 4"/><path d="M14 4l-4 16"/></svg>
            </button>
          </div>
          <span class="cooldown" id="exportCooldown"></span>
          <button type="button" class="icon-btn" id="refreshBtn" aria-label="Refresh" title="Refresh">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
          </button>
          <button type="button" class="icon-btn" id="logoutBtn" aria-label="Log out" title="Log out">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </div>

      <div class="tabs" id="tabs">
        <button type="button" data-status="all" class="active">All</button>
        <button type="button" data-status="awaiting_otp">Not verified</button>
        <button type="button" data-status="verified">Verified</button>
        <button type="button" data-status="expired">Expired</button>
      </div>

      <p class="count" id="countLabel"></p>
      <div id="list" class="status">Loading…</div>
    </section>
  </main>

  <script>
    var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhQGf0CVmKO46t-LMClOXAcBy1ZOcJEfJSJz9SgaIQ-RNUIEPw4-L_xB3KJNW88s7oog/exec";
    var ADMIN_EMAIL = "vishnu.xerago@gmail.com";
  </script>
  <script>
    (function () {
      var TOKEN_KEY = "nfc_admin_token";
      var DOWNLOAD_KEY = "nfc_admin_last_export_at";
      var DOWNLOAD_COOLDOWN_MS = 2 * 60 * 1000;

      document.getElementById("adminIdLabel").textContent = "Admin: " + ADMIN_EMAIL;
      document.getElementById("forgotEmail").value = ADMIN_EMAIL;

      var loginCard = document.getElementById("loginCard");
      var dash = document.getElementById("dash");
      var pageSub = document.getElementById("pageSub");
      var list = document.getElementById("list");
      var countLabel = document.getElementById("countLabel");
      var exportCooldown = document.getElementById("exportCooldown");
      var current = "all";
      var lastRows = [];
      var cooldownTimer = null;

      function api(payload) {
        return fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "cors",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        }).then(function (r) { return r.json(); });
      }

      function getToken() {
        try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
      }
      function setToken(t) {
        try {
          if (t) localStorage.setItem(TOKEN_KEY, t);
          else localStorage.removeItem(TOKEN_KEY);
        } catch (e) {}
      }

      function getLastExportAt() {
        try { return Number(localStorage.getItem(DOWNLOAD_KEY) || 0); } catch (e) { return 0; }
      }
      function setLastExportAt(ts) {
        try { localStorage.setItem(DOWNLOAD_KEY, String(ts)); } catch (e) {}
      }

      function exportWaitMs() {
        var left = DOWNLOAD_COOLDOWN_MS - (Date.now() - getLastExportAt());
        return left > 0 ? left : 0;
      }

      function updateExportCooldownUi() {
        var wait = exportWaitMs();
        var disabled = wait > 0;
        document.getElementById("exportCsvBtn").disabled = disabled;
        document.getElementById("exportXmlBtn").disabled = disabled;
        if (disabled) {
          var sec = Math.ceil(wait / 1000);
          exportCooldown.textContent = "Wait " + sec + "s";
        } else {
          exportCooldown.textContent = "";
        }
      }

      function startCooldownTicker() {
        if (cooldownTimer) clearInterval(cooldownTimer);
        updateExportCooldownUi();
        cooldownTimer = setInterval(function () {
          updateExportCooldownUi();
          if (exportWaitMs() <= 0 && cooldownTimer) {
            clearInterval(cooldownTimer);
            cooldownTimer = null;
          }
        }, 1000);
      }

      function showDash(on) {
        loginCard.classList.toggle("hidden", on);
        dash.classList.toggle("hidden", !on);
        pageSub.textContent = on ? "Admin dashboard" : "Admin login";
        if (on) startCooldownTicker();
      }

      function showAuthPanel(name) {
        ["panel-login", "panel-forgot", "panel-reset"].forEach(function (id) {
          document.getElementById(id).classList.toggle("active", id === name);
        });
      }

      function orDash(v) {
        var s = String(v == null ? "" : v).trim();
        return s ? s : "-";
      }

      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function escapeXml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&apos;");
      }
      function csvCell(s) {
        var v = String(s == null ? "" : s);
        if (/[",\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
        return v;
      }
      function formatTime(iso) {
        if (!iso) return "-";
        try {
          var d = new Date(iso);
          return isNaN(d.getTime()) ? "-" : d.toLocaleString();
        } catch (e) { return "-"; }
      }

      function verifiedCell(row) {
        if (row.status === "verified") {
          var t = formatTime(row.verifiedAt);
          return "<span class='badge'>Verified</span>" +
            (t !== "-" ? "<div style='margin-top:6px;color:#5b7c78;font-size:0.8rem'>" + escapeHtml(t) + "</div>" : "");
        }
        if (row.status === "awaiting_otp") return "<span class='badge warn'>Not verified</span>";
        if (row.status === "expired") return "<span class='badge bad'>Expired</span>";
        return "<span class='badge bad'>" + escapeHtml(orDash(row.status)) + "</span>";
      }

      function renderTable(rows) {
        lastRows = rows || [];
        countLabel.textContent = lastRows.length ? lastRows.length + " registration" + (lastRows.length === 1 ? "" : "s") : "";
        if (!lastRows.length) {
          list.innerHTML = "<p class='status'>No registrations yet.</p>";
          return;
        }
        list.innerHTML =
          "<div class='table-wrap'><table><thead><tr>" +
          "<th>Name</th><th>Number</th><th>Email</th><th>Verified</th>" +
          "</tr></thead><tbody>" +
          lastRows.map(function (row) {
            return "<tr><td>" + escapeHtml(orDash(row.name)) + "</td><td>" +
              escapeHtml(orDash(row.mobile)) + "</td><td>" +
              escapeHtml(orDash(row.email)) + "</td><td>" + verifiedCell(row) + "</td></tr>";
          }).join("") +
          "</tbody></table></div>";
      }

      function loadRegistrations() {
        list.textContent = "Loading…";
        countLabel.textContent = "";
        api({ action: "adminList", adminToken: getToken(), status: current })
          .then(function (data) {
            if (!data.ok) {
              if (/unauth/i.test(data.error || "")) { setToken(""); showDash(false); }
              throw new Error(data.error || "Failed");
            }
            renderTable(data.registrations || []);
          })
          .catch(function (err) {
            lastRows = [];
            list.innerHTML = "<p class='status err'>" + escapeHtml(err.message || "Error") + "</p>";
          });
      }

      function download(filename, text, type) {
        var wait = exportWaitMs();
        if (wait > 0) {
          alert("Please wait " + Math.ceil(wait / 1000) + " seconds before downloading again.");
          startCooldownTicker();
          return;
        }
        if (!lastRows.length) {
          alert("Nothing to export.");
          return;
        }
        var blob = new Blob([text], { type: type });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        setLastExportAt(Date.now());
        startCooldownTicker();
      }

      function exportCsv() {
        var csv = "\uFEFFName,Number,Email,Verified,VerifiedAt\n";
        lastRows.forEach(function (row) {
          csv += [
            csvCell(orDash(row.name)),
            csvCell(orDash(row.mobile)),
            csvCell(orDash(row.email)),
            csvCell(row.status === "verified" ? "yes" : (row.status === "awaiting_otp" ? "not verified" : orDash(row.status))),
            csvCell(row.verifiedAt ? formatTime(row.verifiedAt) : "-")
          ].join(",") + "\n";
        });
        download("registrations.csv", csv, "text/csv;charset=utf-8");
      }

      function exportXml() {
        var xml = '<?xml version="1.0" encoding="UTF-8"?>\n<registrations>\n';
        lastRows.forEach(function (row) {
          xml += "  <customer>\n";
          xml += "    <name>" + escapeXml(orDash(row.name)) + "</name>\n";
          xml += "    <number>" + escapeXml(orDash(row.mobile)) + "</number>\n";
          xml += "    <email>" + escapeXml(orDash(row.email)) + "</email>\n";
          xml += "    <verified>" + escapeXml(row.status === "verified" ? "yes" : (row.status === "awaiting_otp" ? "not verified" : orDash(row.status))) + "</verified>\n";
          xml += "    <verifiedAt>" + escapeXml(row.verifiedAt ? formatTime(row.verifiedAt) : "-") + "</verifiedAt>\n";
          xml += "  </customer>\n";
        });
        xml += "</registrations>\n";
        download("registrations.xml", xml, "application/xml;charset=utf-8");
      }

      document.getElementById("loginBtn").addEventListener("click", function () {
        var msg = document.getElementById("loginMsg");
        msg.textContent = "Signing in…";
        msg.className = "status";
        api({ action: "adminLogin", password: document.getElementById("password").value })
          .then(function (body) {
            if (!body.ok) {
              msg.textContent = body.error || "Login failed";
              msg.className = "status err";
              return;
            }
            setToken(body.adminToken);
            showDash(true);
            loadRegistrations();
          })
          .catch(function (err) {
            msg.textContent = err.message || "Network error";
            msg.className = "status err";
          });
      });

      document.getElementById("showForgotBtn").addEventListener("click", function () {
        showAuthPanel("panel-forgot");
        pageSub.textContent = "Forgot password";
      });
      document.getElementById("backLoginBtn1").addEventListener("click", function () {
        showAuthPanel("panel-login");
        pageSub.textContent = "Admin login";
      });
      document.getElementById("backLoginBtn2").addEventListener("click", function () {
        showAuthPanel("panel-login");
        pageSub.textContent = "Admin login";
      });

      document.getElementById("sendResetBtn").addEventListener("click", function () {
        var msg = document.getElementById("forgotMsg");
        msg.textContent = "Sending…";
        msg.className = "status";
        api({ action: "forgotPassword", email: document.getElementById("forgotEmail").value })
          .then(function (body) {
            if (!body.ok) {
              msg.textContent = body.error || "Failed";
              msg.className = "status err";
              if (/unknown action/i.test(body.error || "")) {
                msg.textContent = "Apps Script not updated. Paste latest google-apps-script.js and deploy a New version.";
              }
              return;
            }
            msg.textContent = body.message || "Check your email for the code.";
            msg.className = "status ok";
            showAuthPanel("panel-reset");
            pageSub.textContent = "Change password";
          })
          .catch(function () {
            msg.textContent = "Network error";
            msg.className = "status err";
          });
      });

      document.getElementById("resetBtn").addEventListener("click", function () {
        var msg = document.getElementById("resetMsg");
        msg.textContent = "Updating…";
        msg.className = "status";
        api({
          action: "resetPassword",
          code: document.getElementById("resetCode").value,
          newPassword: document.getElementById("newPassword").value
        })
          .then(function (body) {
            if (!body.ok) {
              msg.textContent = body.error || "Failed";
              msg.className = "status err";
              return;
            }
            msg.textContent = body.message || "Password updated.";
            msg.className = "status ok";
            showAuthPanel("panel-login");
            pageSub.textContent = "Admin login";
            document.getElementById("loginMsg").textContent = "Password updated. Log in with the new password.";
            document.getElementById("loginMsg").className = "status ok";
          })
          .catch(function () {
            msg.textContent = "Network error";
            msg.className = "status err";
          });
      });

      document.getElementById("logoutBtn").addEventListener("click", function () {
        setToken("");
        lastRows = [];
        showDash(false);
        showAuthPanel("panel-login");
      });
      document.getElementById("refreshBtn").addEventListener("click", loadRegistrations);
      document.getElementById("exportCsvBtn").addEventListener("click", exportCsv);
      document.getElementById("exportXmlBtn").addEventListener("click", exportXml);

      document.getElementById("tabs").addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-status]");
        if (!btn) return;
        current = btn.getAttribute("data-status");
        Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
          b.classList.toggle("active", b === btn);
        });
        loadRegistrations();
      });

      if (getToken()) {
        showDash(true);
        loadRegistrations();
      }
    })();
  </script>
</body>
</html>

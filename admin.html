<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Admin · Registrations</title>
  <style>
    :root {
      --bg: #f8fafc;
      --ink: #0f172a;
      --muted: #64748b;
      --brand: #0f766e;
      --danger: #b91c1c;
      --ok: #047857;
      --border: #e2e8f0;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      min-height: 100dvh;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
    h1 { margin: 0 0 6px; font-size: 1.4rem; }
    .sub { margin: 0 0 18px; color: var(--muted); font-size: 0.92rem; }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    input, button { font: inherit; width: 100%; }
    input {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 11px 14px;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--border); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row button { width: auto; min-width: 110px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .tabs button {
      width: auto;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--border);
      font-weight: 600;
    }
    .tabs button.active { background: var(--brand); color: #fff; border-color: var(--brand); }
    .msg { color: var(--muted); font-size: 0.9rem; }
    .err { color: var(--danger); }
    .hidden { display: none !important; }
    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .toolbar h2 { margin: 0; font-size: 1.05rem; }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      min-width: 680px;
    }
    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    th {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      white-space: nowrap;
      background: #f8fafc;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 999px;
      background: #ecfdf5;
      color: var(--ok);
      white-space: nowrap;
    }
    .badge.warn { background: #fff7ed; color: #c2410c; }
    .badge.bad { background: #fef2f2; color: var(--danger); }
    .count { font-size: 0.85rem; color: var(--muted); margin: 0 0 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Admin dashboard</h1>
    <p class="sub">Customer registrations</p>

    <section id="loginCard" class="card">
      <label for="password">Admin password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button type="button" id="loginBtn">Log in</button>
      <p class="msg" id="loginMsg"></p>
    </section>

    <section id="dash" class="hidden">
      <div class="toolbar">
        <h2>Registrations</h2>
        <div class="row" style="width:auto">
          <button type="button" class="secondary" id="exportBtn">Export XML</button>
          <button type="button" class="secondary" id="refreshBtn">Refresh</button>
          <button type="button" class="secondary" id="logoutBtn">Log out</button>
        </div>
      </div>

      <div class="tabs" id="tabs">
        <button type="button" data-status="all" class="active">All</button>
        <button type="button" data-status="awaiting_otp">Not verified</button>
        <button type="button" data-status="verified">Verified</button>
        <button type="button" data-status="expired">Expired</button>
      </div>

      <div class="card">
        <p class="count" id="countLabel"></p>
        <div id="list" class="msg">Loading…</div>
      </div>
    </section>
  </div>

  <script>
    var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhQGf0CVmKO46t-LMClOXAcBy1ZOcJEfJSJz9SgaIQ-RNUIEPw4-L_xB3KJNW88s7oog/exec";
  </script>
  <script>
    (function () {
      var TOKEN_KEY = "nfc_admin_token";
      var loginCard = document.getElementById("loginCard");
      var dash = document.getElementById("dash");
      var loginMsg = document.getElementById("loginMsg");
      var list = document.getElementById("list");
      var countLabel = document.getElementById("countLabel");
      var current = "all";
      var lastRows = [];

      function api(payload) {
        return fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "cors",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        }).then(function (r) { return r.json(); });
      }

      function getToken() {
        try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
      }

      function setToken(t) {
        try {
          if (t) localStorage.setItem(TOKEN_KEY, t);
          else localStorage.removeItem(TOKEN_KEY);
        } catch (e) {}
      }

      function showDash(on) {
        loginCard.classList.toggle("hidden", on);
        dash.classList.toggle("hidden", !on);
      }

      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function escapeXml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&apos;");
      }

      function formatTime(iso) {
        if (!iso) return "—";
        try {
          var d = new Date(iso);
          if (isNaN(d.getTime())) return String(iso);
          return d.toLocaleString();
        } catch (e) {
          return String(iso);
        }
      }

      function verifiedCell(row) {
        if (row.status === "verified") {
          return (
            "<span class='badge'>Verified</span>" +
            (row.verifiedAt ? "<div style='margin-top:6px;color:#64748b;font-size:0.8rem'>" + escapeHtml(formatTime(row.verifiedAt)) + "</div>" : "")
          );
        }
        if (row.status === "awaiting_otp") {
          return "<span class='badge warn'>Not verified</span>";
        }
        if (row.status === "expired") {
          return "<span class='badge bad'>Expired</span>";
        }
        return "<span class='badge bad'>" + escapeHtml(row.status || "—") + "</span>";
      }

      function renderTable(rows) {
        lastRows = rows || [];
        countLabel.textContent = lastRows.length
          ? lastRows.length + " registration" + (lastRows.length === 1 ? "" : "s")
          : "";

        if (!lastRows.length) {
          list.innerHTML = "<p class='msg'>No registrations yet.</p>";
          return;
        }

        var body = lastRows.map(function (row) {
          return (
            "<tr>" +
              "<td>" + escapeHtml(row.name || "—") + "</td>" +
              "<td>" + escapeHtml(row.mobile || "—") + "</td>" +
              "<td>" + escapeHtml(row.email || "—") + "</td>" +
              "<td>" + verifiedCell(row) + "</td>" +
            "</tr>"
          );
        }).join("");

        list.innerHTML =
          "<div class='table-wrap'><table>" +
            "<thead><tr>" +
              "<th>Name</th>" +
              "<th>Number</th>" +
              "<th>Email</th>" +
              "<th>Verified</th>" +
            "</tr></thead>" +
            "<tbody>" + body + "</tbody>" +
          "</table></div>";
      }

      function loadRegistrations() {
        list.textContent = "Loading…";
        countLabel.textContent = "";
        api({ action: "adminList", adminToken: getToken(), status: current })
          .then(function (data) {
            if (!data.ok) {
              if (/unauth/i.test(data.error || "")) {
                setToken("");
                showDash(false);
              }
              throw new Error(data.error || "Failed");
            }
            renderTable(data.registrations || []);
          })
          .catch(function (err) {
            lastRows = [];
            countLabel.textContent = "";
            list.innerHTML = "<p class='err'>" + escapeHtml(err.message || "Error") + "</p>";
          });
      }

      function exportXml() {
        if (!lastRows.length) {
          alert("Nothing to export.");
          return;
        }
        var xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
        xml += "<registrations exportedAt=\"" + escapeXml(new Date().toISOString()) + "\">\n";
        lastRows.forEach(function (row) {
          xml += "  <customer>\n";
          xml += "    <name>" + escapeXml(row.name || "") + "</name>\n";
          xml += "    <number>" + escapeXml(row.mobile || "") + "</number>\n";
          xml += "    <email>" + escapeXml(row.email || "") + "</email>\n";
          xml += "    <verified>" + (row.status === "verified" ? "yes" : "no") + "</verified>\n";
          xml += "    <verifiedAt>" + escapeXml(row.verifiedAt || "") + "</verifiedAt>\n";
          xml += "  </customer>\n";
        });
        xml += "</registrations>\n";

        var blob = new Blob([xml], { type: "application/xml;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "registrations.xml";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      document.getElementById("loginBtn").addEventListener("click", function () {
        loginMsg.textContent = "Signing in…";
        loginMsg.className = "msg";
        api({ action: "adminLogin", password: document.getElementById("password").value })
          .then(function (body) {
            if (!body.ok) {
              loginMsg.textContent = body.error || "Login failed";
              loginMsg.className = "msg err";
              return;
            }
            setToken(body.adminToken);
            showDash(true);
            loadRegistrations();
          })
          .catch(function (err) {
            loginMsg.textContent = err.message || "Network error";
            loginMsg.className = "msg err";
          });
      });

      document.getElementById("logoutBtn").addEventListener("click", function () {
        setToken("");
        lastRows = [];
        showDash(false);
      });

      document.getElementById("refreshBtn").addEventListener("click", loadRegistrations);
      document.getElementById("exportBtn").addEventListener("click", exportXml);

      document.getElementById("tabs").addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-status]");
        if (!btn) return;
        current = btn.getAttribute("data-status");
        Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
          b.classList.toggle("active", b === btn);
        });
        loadRegistrations();
      });

      if (getToken()) {
        showDash(true);
        loadRegistrations();
      }
    })();
  </script>
</body>
</html>
